<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>네컷 사진 받기</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1FF; --surface:#FFFFFF; --ink:#16163A; --muted:#5B5F86;
  --accent:#3148F5; --line:#D6DBF5; --chip:#F5F6FF;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1130; --surface:#1A1D45; --ink:#EEF0FF; --muted:#A3A8D6;
    --accent:#8391FF; --line:#2E3270; --chip:#232757; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55;
  padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:520px;margin:0 auto;text-align:center}
h1{font-family:var(--display);font-weight:400;font-size:30px;margin:0 0 6px}
.sub{margin:0 0 18px;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:14px}
img.photo{display:block;width:100%;height:auto;border-radius:12px}
.btn{display:inline-block;border:0;border-radius:999px;padding:15px 34px;font-weight:800;font-size:17px;
  background:var(--accent);color:#fff;cursor:pointer;margin-top:18px;text-decoration:none}
.btn.ghost{background:var(--chip);color:var(--ink);border:1.5px solid var(--line);font-size:15px;padding:11px 22px}
.msg{margin:14px 0 0;color:var(--muted);font-size:14px}
.state{padding:40px 10px;color:var(--muted)}
.hint{margin-top:22px;font-size:13px;color:var(--muted);line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <h1>네컷 사진 받기</h1>
  <p class="sub" id="sub">사진을 불러오는 중이에요…</p>

  <div class="card" id="card" hidden>
    <img class="photo" id="photo" alt="촬영한 네컷 사진">
  </div>

  <div id="actions" hidden>
    <button class="btn" id="save" type="button">사진 저장</button>
    <p class="msg" id="msg"></p>
  </div>

  <div class="state" id="state" hidden></div>

  <p class="hint" id="hint" hidden>
    이 주소는 촬영하신 분만 열 수 있는 개인 링크예요.<br>
    다른 분의 사진은 보이지 않고, 정해진 시간이 지나면 링크가 만료돼요.
  </p>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const sub=$("sub"), card=$("card"), photo=$("photo"), actions=$("actions"), saveBtn=$("save"),
        msg=$("msg"), state=$("state"), hint=$("hint");

  function fail(text){
    sub.hidden=true; card.hidden=true; actions.hidden=true;
    state.hidden=false; state.textContent=text;
  }

  async function loadConfig(){
    const r=await fetch(new URL("config.json", location.href), {cache:"no-store"});
    return await r.json();
  }

  async function start(){
    const raw=decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if(!raw){ fail("사진 주소가 올바르지 않아요. 부스 화면의 QR을 다시 찍어 주세요."); return; }

    let cfg=null;
    try{ cfg=await loadConfig(); }
    catch(e){ fail("설정을 불러오지 못했어요. 잠시 후 다시 시도해 주세요."); return; }

    let url="", name="4cut.jpg";
    const bar=raw.indexOf("|");
    if(bar>0){
      // 예전 방식: 주소와 토큰이 함께 담긴 QR
      const path=raw.slice(0,bar), token=raw.slice(bar+1);
      const base=new URL(cfg.uploadUrl).origin;
      url=`${base}/storage/v1/object/sign/photos/${path}?token=${encodeURIComponent(token)}`;
      name=`4cut_${path.split("/").pop()}`;
    }else{
      // 새 방식: 사진 경로만 담고, 여기서 임시 주소를 받아 옵니다
      const endpoint=cfg.linkUrl || cfg.uploadUrl.replace("upload-photo","get-photo");
      try{
        const r=await fetch(endpoint, {
          method:"POST",
          headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+cfg.apiKey, "apikey":cfg.apiKey },
          body: JSON.stringify({ path: raw })
        });
        const j=await r.json().catch(()=>({}));
        if(r.status===410 || j.expired){
          fail(`사진을 받을 수 있는 시간(${j.expiresHours || cfg.expiresHours || 10}시간)이 지났어요.`);
          return;
        }
        if(!r.ok || !j.url) throw new Error("no url");
        url=j.url;
        name=`4cut_${raw.split("/").pop()}`;
      }catch(e){
        fail("사진을 불러오지 못했어요. 잠시 후 다시 시도하거나 부스 담당자에게 문의해 주세요.");
        return;
      }
    }

    photo.onload=()=>{
      sub.textContent="아래 버튼을 누르면 휴대폰에 저장돼요.";
      card.hidden=false; actions.hidden=false; hint.hidden=false;
    };
    photo.onerror=()=>fail("사진을 불러오지 못했어요. 링크가 만료되었을 수 있어요.");
    photo.src=url;

    saveBtn.addEventListener("click", async ()=>{
      saveBtn.disabled=true; msg.textContent="저장하는 중이에요…";
      try{
        const res=await fetch(url);
        if(!res.ok) throw new Error("fetch");
        const blob=await res.blob();
        const obj=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=obj; a.download=name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(obj), 5000);
        msg.textContent="저장했어요. 사진첩이나 다운로드 폴더에서 확인하세요.";
      }catch(e){
        msg.textContent="저장 버튼이 동작하지 않으면, 위 사진을 길게 눌러 ‘이미지 저장’을 선택하세요.";
      }finally{ saveBtn.disabled=false; }
    });
  }

  start();
})();
</script>
</body>
</html>
